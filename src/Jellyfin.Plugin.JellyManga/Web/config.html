<div id="jellyMangaConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content"><div class="content-primary"><p id="jm-config-status" role="status">Loading JellyTome dashboard...</p><div id="jm-dashboard-host"></div></div></div>
  <script>
  (function () {
    var page = document.getElementById('jellyMangaConfigurationPage');
    if (page._jellyTomeReady) return;
    page._jellyTomeReady = true;
    var host = page.querySelector('#jm-dashboard-host');
    var status = page.querySelector('#jm-config-status');
    var opening;
    function assets() {
      if (window.JellyManga) return Promise.resolve();
      if (window.jellyTomeAssetLoad) return window.jellyTomeAssetLoad;
      window.jellyTomeAssetLoad = new Promise(function (resolve, reject) {
        var link = document.createElement('link'); link.rel = 'stylesheet'; link.href = ApiClient.getUrl('JellyManga/assets/app.css'); document.head.appendChild(link);
        var script = document.createElement('script'); script.src = ApiClient.getUrl('JellyManga/assets/app.js');
        script.onload = resolve; script.onerror = function () { window.jellyTomeAssetLoad = null; reject(new Error('Could not load the JellyTome dashboard. Refresh this page to retry.')); };
        document.head.appendChild(script);
      });
      return window.jellyTomeAssetLoad;
    }
    function show() {
      if (opening) return opening;
      status.textContent = 'Loading JellyTome dashboard...';
      opening = assets().then(function () { return window.JellyManga.open('admin', { host: host }); })
        .then(function () { status.textContent = ''; })
        .catch(function (error) { status.textContent = error.message; })
        .finally(function () { opening = null; });
      return opening;
    }
    page.addEventListener('viewshow', show);
    page.addEventListener('pageshow', show);
    page.addEventListener('viewhide', function () { if (window.JellyManga) window.JellyManga.closeEmbedded(host); });
    show();
  })();
  </script>
</div>
